# ---------------------------------------------------------------------------
# Alembic configuration for PhishGuard.
#
# Usage (from the project root):
#
#     alembic -c backend/alembic.ini upgrade head
#     alembic -c backend/alembic.ini revision --autogenerate -m "message"
#     alembic -c backend/alembic.ini downgrade -1
#
# The database URL is taken from the application settings (DATABASE_URL
# environment variable or `.env`), so migrations and the running application
# always target the same database.
# ---------------------------------------------------------------------------

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
path_separator = os
version_path_separator = os

# The URL is resolved at runtime in `alembic/env.py` from the app settings.
sqlalchemy.url =

# Timestamped, descriptive migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
