[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "AI-Powered Phishing Detection and Website Safety Verification System"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nasarawa State University, Keffi - BSc Computer Science" },
]
keywords = ["phishing", "machine-learning", "url-analysis", "cybersecurity"]

dependencies = [
    "numpy>=1.24,<2.1",
    "pandas>=2.0,<2.3",
    "scipy>=1.10",
    "scikit-learn>=1.3,<1.7",
    "joblib>=1.3",
    "xgboost>=1.7,<3.1",
    "matplotlib>=3.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "python-dotenv>=1.0",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
phishguard-train = "ml.src.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phishguard*", "ml*", "backend*"]
exclude = ["frontend*", "refs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
